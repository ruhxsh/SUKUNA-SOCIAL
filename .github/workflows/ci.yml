name: SOCIAL checks

on:
  push:
    branches: [main, "rebuild/**"]
  pull_request:
    branches: [main, "rebuild/**"]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check syntax
        run: npm run check
      - name: Run tests
        run: npm test
